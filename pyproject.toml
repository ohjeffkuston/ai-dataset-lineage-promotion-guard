[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "ai-dataset-lineage-promotion-guard"
version = "0.1.0"
description = "Deterministic AI dataset lineage and promotion evidence checks"
requires-python = ">=3.11"
dependencies = ["PyYAML>=6.0"]

[project.scripts]
dataset-lineage-guard = "dataset_lineage_guard.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
